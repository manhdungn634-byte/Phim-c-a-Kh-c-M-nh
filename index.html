<style>

.er{display:flex;gap:12px;padding:10px 0;border-radius:8px;cursor:pointer}

.er .et img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.er .et>*:not(img){position:relative}.pl{font-size:1.6rem;text-shadow:0 1px 6px #000}
.eq{display:flex;gap:3px;align-items:flex-end;height:22px}.eq i{width:6px;background:#fff;animation:eq 1s infinite}.eq i:nth-child(1){height:10px}.eq i:nth-child(2){height:22px;animation-delay:.2s}.eq i:nth-child(3){height:15px;animation-delay:.4s}
@keyframes eq{50%{transform:scaleY(.4)}}

<div class="hd"><div class="logo"><i>▶</i>Phim</div><div class="sp"></div><button class="ib f" data-act="srch">🔍</button><button class="ib f" data-act="nav" data-v="acc">👤</button></div>

<script>
const $=s=>document.querySelector(s);
async function net(u){try{const r=await fetch(u,{signal:AbortSignal.timeout?AbortSignal.timeout(12000):undefined});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}catch(e){if(!/^https?:/.test(location.protocol)||/localhost|127\./.test(u))throw e;const r=await fetch('/proxy?url='+encodeURIComponent(u));if(!r.ok)throw e;return await r.json()}}
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
const MEM=new Map();
async function jf(u){const h=MEM.get(u);if(h&&Date.now()-h.t<3e5)return h.d;const d=await net(u);MEM.set(u,{t:Date.now(),d});return d}
let hp;const needHls=()=>hp||(hp=new Promise((ok,no)=>{if(window.Hls)return ok();const e=document.createElement('script');e.src='https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js';e.onload=ok;e.onerror=()=>{hp=null;no()};document.head.appendChild(e)}));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sg=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const ss=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const OPT=()=>sg('imgopt',1)!==0;
const im=(u,w)=>!u?'':OPT()&&/^https?:/.test(u)?'https://wsrv.nl/?url='+encodeURIComponent(u)+'&w='+w+'&we&q=65&output=webp':u;
function ie(i){const o=i.dataset.o;if(o&&i.src!==o){i.removeAttribute('srcset');i.src=o}else i.remove()}
const TABS=['Phim Bộ','Phim Lẻ','Hoạt Hình','Tất Cả'],TY=['series','single','hoathinh',''];
const names=['Đêm Sài Gòn','Hành Tinh Cuối','Kiếm Khách','Mùa Hè Năm Ấy','Đại Dương Xanh','Bóng Tối','Thành Phố Ngủ','Cung Đường Mới','Ký Ức Mưa','Cuộc Đua','Vùng Đất Lạ','Hoàng Hôn'];
const demo=names.map((t,i)=>({id:'d'+i,demo:1,title:t,year:2026-(i%5),hue:(i*37)%360,img:'',type:['series','single','hoathinh'][i%3],ep:i%3==1?'Full':(8+i)+'/24 tập',slug:'',o:'',desc:'Nội dung mẫu. Nhập API thật để xem phim.',mod:''}));
let err='',music=[],nv='home',movies=[],view='home',tab=-1,q='',cur=null,hi=0,hls=null,rng=0,eps=[],epi=-1,lastS=-1;
const grad=m=>`linear-gradient(160deg,hsl(${m.hue} 60% 38%),hsl(${(m.hue+50)%360} 55% 14%))`;
const find=id=>movies.find(m=>m.id===id)||music.find(m=>m.id===id)||sg('watching',[]).find(m=>m.id===id)||sg('mylist',[]).find(m=>m.id===id);
function norm(j){
  const a=j.items||(j.data&&(j.data.items||j.data))||j.results||j.movies||j;
  if(!Array.isArray(a))throw new Error('Không tìm thấy danh sách phim');
  const cdn=j.data&&j.data.APP_DOMAIN_CDN_IMAGE;
  const base=j.pathImage||(cdn?cdn.replace(/\/$/,'')+'/uploads/movies/':'https://phimapi.com/uploads/movies/');
  return a.map((m,i)=>{
    let img=m.poster_url||m.thumb_url||m.poster||m.image||'';
    if(img&&!/^https?:/.test(img))img=base.replace(/\/$/,'')+'/'+img.replace(/^\//,'');
    const ep=m.episode_current||'';
    return{id:String(m.slug||m._id||m.id||i),title:m.name||m.title||'Phim',o:m.origin_name||'',year:m.year||'',hue:(i*37)%360,img,slug:m.slug||'',ep,type:m.type||(ep?(/full/i.test(ep)?'single':'series'):''),desc:'',mod:(m.modified&&m.modified.time)||''};
  });
}
const poster=(m,o)=>{o=o||{};return `<div class="c f" tabindex="0" data-act="open" data-id="${esc(m.id)}"><div class="pz" style="background:${grad(m)}">${m.img?`<img src="${esc(im(m.img,280))}" srcset="${esc(im(m.img,150))} 1x, ${esc(im(m.img,280))} 2x" data-o="${esc(m.img)}" alt="" ${o.eager?'fetchpriority="high"':'loading="lazy"'} decoding="async" onload="this.classList.add('l')" onerror="ie(this)">`:''}<b>${esc(m.title)}</b>${o.top?`<div class="bd">TOP<i>10</i></div>`:''}${m.ep?`<div class="lb"><b>${/full/i.test(m.ep)?'FULL':'TẬP MỚI'}</b><s>${esc(m.ep)}</s></div>`:''}</div>${o.p!=null?`<div class="bar"><i style="width:${o.p}%"></i></div>`:''}</div>`};
const sec=(t,h)=>`<div class="sh"><h2>${t}</h2><span>›</span></div><div class="rw">${h}</div>`;
const flt=()=>movies.filter(m=>(tab<0||!TY[tab]||m.type===TY[tab])&&(!q||(m.title+' '+m.o).toLowerCase().includes(q)));

const GENRES=[['Bí Ẩn','bi-an'],['Chiến Tranh','chien-tranh'],['Chính Kịch','chinh-kich'],['Cổ Trang','co-trang'],['Gia Đình','gia-dinh'],['Hài Hước','hai-huoc'],['Hành Động','hanh-dong'],['Hình Sự','hinh-su'],['Học Đường','hoc-duong'],['Khoa Học','khoa-hoc'],['Kinh Dị','kinh-di'],['Kinh Điển','kinh-dien'],['Lịch Sử','lich-su'],['Miền Tây','mien-tay'],['Phim Ngắn','phim-ngan'],['Phiêu Lưu','phieu-luu'],['Thần Thoại','than-thoai'],['Thể Thao','the-thao'],['Trẻ Em','tre-em'],['Tài Liệu','tai-lieu'],['Tâm Lý','tam-ly'],['Tình Cảm','tinh-cam'],['Viễn Tưởng','vien-tuong'],['Võ Thuật','vo-thuat'],['Âm Nhạc','am-nhac']].map(a=>({name:a[0],slug:a[1]}));
let genres=GENRES,gsel='',gmsg='';
const JF=u=>typeof jf==='function'?jf(u):fetch(u).then(r=>r.json());
async function loadGenres(){genres=GENRES;try{const j=await JF(BASE+'/the-loai'),a=(j.data&&j.data.items)||j.items||j;if(Array.isArray(a)&&a.length)genres=a.map(g=>({name:g.name,slug:g.slug}))}catch(e){}if(view==='genre')r()}
async function pickGenre(s){gsel=s;music=[];gmsg='Đang tải...';r();try{music=norm(await JF(BASE+'/v1/api/the-loai/'+s));gmsg='Không có phim trong thể loại này.'}catch(e){gmsg='Không tải được phim. Kiểm tra kết nối mạng.'}r()}
const genreV=()=>`<div class="sh"><h2>Thể loại</h2></div><div class="chips">${genres.map(g=>`<button class="ch f ${g.slug===gsel?'on':''}" data-act="genre" data-s="${esc(g.slug)}">${esc(g.name)}</button>`).join('')}</div>${gsel?gridOf(music,gmsg):'<p class="em">Chọn một thể loại để xem phim.</p>'}`;
// Nạp trước chi tiết phim khi chạm/di chuyển tới thẻ
function warm(e){const c=e.target.closest&&e.target.closest('[data-act="open"][data-id]');if(!c)return;const m=find(c.dataset.id);if(!m||!m.slug)return;jf(BASE+'/phim/'+m.slug).catch(()=>{})}
document.addEventListener('pointerdown',warm,{passive:true});document.addEventListener('focusin',warm);
// Điều khiển bằng remote TV
document.addEventListener('keydown',e=>{
  const k=e.key,a=document.activeElement,det=$('#det').classList.contains('on');
  if(k==='Escape'||(k==='Backspace'&&!/INPUT|SELECT/.test(a.tagName))){
    if(det)closeDet();else return;e.preventDefault();return}
  if(k==='Enter'&&a.classList&&a.classList.contains('f')&&a.tagName==='DIV'){a.click();return}
  if(!/^Arrow/.test(k)||(a.type==='range'?(k==='ArrowLeft'||k==='ArrowRight'):/INPUT|VIDEO|SELECT/.test(a.tagName)))return;
  if(det)show();
  const root=det?$('#det'):document;
  const fs=[...root.querySelectorAll('.f')].filter(x=>x.offsetParent);e.preventDefault();
  if(!fs.includes(a)){fs[0]&&fs[0].focus();return}
  const R=a.getBoundingClientRect(),cx=R.left+R.width/2,cy=R.top+R.height/2;let best=null,bs=1e9;
  const hz=k==='ArrowRight'||k==='ArrowLeft';
  fs.forEach(x=>{if(x===a)return;const b=x.getBoundingClientRect(),dx=b.left+b.width/2-cx,dy=b.top+b.height/2-cy;
    const p=k==='ArrowRight'?dx:k==='ArrowLeft'?-dx:k==='ArrowDown'?dy:-dy,s=hz?Math.abs(dy):Math.abs(dx);
    if(p>4){const sc=p+s*2.5;if(sc<bs){bs=sc;best=x}}});
  if(best){best.focus();best.scrollIntoView({block:'center',inline:'center',behavior:e.repeat?'auto':'smooth'})}
});
r();
const BASE='https://phimapi.com';
const SRC=[['/danh-sach/phim-moi-cap-nhat?page=1',''],['/v1/api/danh-sach/phim-bo?page=1&limit=24','series'],['/v1/api/danh-sach/phim-le?page=1&limit=24','single'],['/v1/api/danh-sach/hoat-hinh?page=1&limit=24','hoathinh']];
async function loadAll(){
  const rs=await Promise.allSettled(SRC.map(a=>jf(BASE+a[0]))),seen=new Map(),out=[];
  rs.forEach((x,k)=>{if(x.status!=='fulfilled')return;try{norm(x.value).forEach(m=>{const t=SRC[k][1],o=seen.get(m.id);if(o){if(t)o.type=t;return}if(t)m.type=t;seen.set(m.id,m);out.push(m)})}catch(e){}});
  if(!out.length)throw new Error('empty');
  out.forEach((m,i)=>m.hue=(i*37)%360);return out;
}
async function boot(){
  const c=sg('lc2',null);if(Array.isArray(c)&&c.length){movies=c;r()}
  try{movies=await loadAll();ss('lc2',movies);err=''}catch(e){if(!movies.length)err='Không tải được dữ liệu từ KKPhim. Kiểm tra kết nối mạng.'}
  r();
}
boot();
